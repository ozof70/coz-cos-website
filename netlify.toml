[build]
  publish = "."

# Consolidate legacy copies of the Chinese homepage into its canonical URL.
[[redirects]]
  from = "/zh.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/zh"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# BEGIN extensionless page routes
# Explicit routes keep one canonical URL and leave API/asset paths untouched.
[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

