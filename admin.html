<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>COz Cos 管理後台</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=optional"><link rel="stylesheet" href="/styles.css"></head><body class="info-page"><header class="header info-header"><a class="info-home" href="/about-zh.html"><img src="/assets/coz-logo.svg" alt=""><span>COz Cos</span></a></header><main class="info-content"><h1>管理員登入</h1><form id="admin-login" class="cms-form"><label>管理員密碼<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登入</button></form><p id="admin-status" role="status"></p><section id="admin-dashboard" hidden><div class="admin-heading"><h2>管理後台</h2><button id="admin-logout" type="button">登出</button></div><section id="admin-home"><div class="traffic-grid"><article><h3>本日瀏覽</h3><p id="traffic-today">—</p></article><article><h3>本月瀏覽</h3><p id="traffic-month">—</p></article></div><p class="service-note">從後台啟用後累積，僅統計同意流量記錄的瀏覽；與 Google Analytics 數據分開，這不是不重複訪客數。</p><nav class="admin-shortcuts" aria-label="管理項目"><button type="button" data-admin-view="news"><span>最新消息管理</span><small>新增、編輯與刪除公告</small><span aria-hidden="true">↗</span></button><button type="button" data-admin-view="roles"><span>圓夢角色管理</span><small>管理作品、角色與尺碼</small><span aria-hidden="true">↗</span></button></nav></section><section id="admin-news-view" hidden><button type="button" class="admin-back" data-admin-view="home">← 返回管理首頁</button><div class="admin-section-heading"><h2 tabindex="-1">最新消息管理</h2><button type="button" class="admin-add" data-create-form="admin-news" aria-haspopup="dialog" aria-controls="admin-news-create">＋ 新增公告</button></div><dialog id="admin-news-create" class="admin-create-dialog" aria-labelledby="admin-news-create-title"><div class="admin-dialog-heading"><h2 id="admin-news-create-title">新增公告</h2><button type="button" class="admin-dialog-close" data-close-create aria-label="關閉新增視窗">×</button></div><form id="admin-news" class="cms-form"><label>公告標題<input name="title" maxlength="200" required></label><label>詳細內容<textarea name="body" rows="7" maxlength="12000" required></textarea></label><button type="submit">發布公告</button></form></dialog><h3 class="sr-only">現有公告</h3><div id="admin-news-list"></div></section><section id="admin-roles-view" hidden><button type="button" class="admin-back" data-admin-view="home">← 返回管理首頁</button><div class="admin-section-heading"><h2 tabindex="-1">圓夢角色管理</h2><button type="button" class="admin-add" data-create-form="admin-role" aria-haspopup="dialog" aria-controls="admin-role-create">＋ 新增角色</button></div><dialog id="admin-role-create" class="admin-create-dialog" aria-labelledby="admin-role-create-title"><div class="admin-dialog-heading"><h2 id="admin-role-create-title">新增角色</h2><button type="button" class="admin-dialog-close" data-close-create aria-label="關閉新增視窗">×</button></div><form id="admin-role" class="cms-form"><label>作品名稱<input name="work" maxlength="200" required></label><label>角色名稱<input name="character" maxlength="200" required></label><label>尺碼<input name="size" maxlength="200" required></label><button type="submit">新增角色</button></form></dialog><h3 class="sr-only">現有作品與角色</h3><div id="admin-role-list"></div></section></section></main><script src="/cms-ui.js" defer></script></body></html>
