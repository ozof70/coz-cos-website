<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>COz Cos 管理後台</title><link rel="stylesheet" href="/styles.css"></head><body class="info-page"><header class="header info-header"><a class="info-home" href="/about-zh.html"><img src="/assets/coz-logo.svg" alt=""><span>COz Cos</span></a></header><main class="info-content"><h1>管理員登入</h1><form id="admin-login" class="cms-form"><label>管理員密碼<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登入</button></form><p id="admin-status" role="status"></p><section id="admin-dashboard" hidden><div class="admin-heading"><h2>管理後台</h2><button id="admin-logout" type="button">登出</button></div><div class="traffic-grid"><article><h3>本日瀏覽</h3><p id="traffic-today">—</p></article><article><h3>本月瀏覽</h3><p id="traffic-month">—</p></article></div><p class="service-note">從後台啟用後累積，僅統計同意流量記錄的瀏覽；與 Google Analytics 數據分開，這不是不重複訪客數。</p><h2>新增最新消息</h2><form id="admin-news" class="cms-form"><label>公告標題<input name="title" maxlength="200" required></label><label>詳細內容<textarea name="body" rows="7" maxlength="12000" required></textarea></label><button type="submit">發布公告</button></form><div id="admin-news-list"></div><h2>新增圓夢角色</h2><form id="admin-role" class="cms-form"><label>作品名稱<input name="work" maxlength="200" required></label><label>角色名稱<input name="character" maxlength="200" required></label><label>尺碼<input name="size" maxlength="200" required></label><button type="submit">新增角色</button></form><div id="admin-role-list"></div></section></main><script src="/cms-ui.js" defer></script></body></html>
